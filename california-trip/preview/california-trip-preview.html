<title>קליפורניה שלנו</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Noto+Sans+Hebrew:wght@400;500;600;700;800&display=swap">
<style>
/* קליפורניה שלנו — שפת עיצוב אחת לכל האתר.
   פריסה: שמיים בהירים עם ענני כותנה ומטוסי נייר, כרטיסי זכוכית מוארים במרכז,
   טיפוגרפיה עברית חדה. עיצוב בהיר בלבד, בכוונה. */
:root {
  color-scheme: light;
  --h-bg: #fbfbfd;
  --h-ink: #1d1d1f;
  --h-soft: #6e6e73;
  --h-line: rgba(29, 29, 31, 0.08);
  --sky-1: #86c8f0;
  --sky-2: #c4e5f9;
  --paper-yellow: #f7c948;
  --paper-mint: #9eddb2;
  --gold: #c98f0e;
  --glass: rgba(255, 255, 255, 0.58);
  --glass-line: rgba(255, 255, 255, 0.78);
  --glass-shadow: 0 1px 0 rgba(255, 255, 255, 0.9) inset, 0 24px 70px rgba(30, 60, 100, 0.14);
  --font-home: "Noto Sans Hebrew", "Heebo", "Assistant", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--sky-1);
  color: var(--h-ink);
  font-family: var(--font-home);
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid rgba(29, 29, 31, 0.55); outline-offset: 3px; }

.glass {
  background: var(--glass);
  border: 1px solid var(--glass-line);
  box-shadow: var(--glass-shadow);
  backdrop-filter: blur(26px) saturate(180%);
  -webkit-backdrop-filter: blur(26px) saturate(180%);
}

/* ---------- מטוסי נייר וענני כותנה (משותף) ---------- */
.origami-svg { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 22px 26px rgba(30, 70, 120, 0.22)); }
.origami--yellow { --f1: #ffe48a; --f2: #f7c948; --f3: #e3ad2b; --f4: #c98f17; }
.origami--mint { --f1: #d5f5de; --f2: #a6e3b9; --f3: #7fcb98; --f4: #5fb07c; }
.origami--white { --f1: #ffffff; --f2: #eef2f6; --f3: #d9e1ea; --f4: #c2cdd9; }
.origami .f1 { fill: var(--f1); }
.origami .f2 { fill: var(--f2); }
.origami .f3 { fill: var(--f3); }
.origami .f4 { fill: var(--f4); }
.origami .crease { stroke: rgba(255, 255, 255, 0.7); stroke-width: 1.2; }
.cloud {
  position: absolute;
  z-index: 1;
  aspect-ratio: 2.3;
  pointer-events: none;
  background:
    radial-gradient(ellipse 24% 52% at 28% 62%, #fff 55%, #eaf3fa 92%, transparent 100%),
    radial-gradient(ellipse 26% 60% at 52% 42%, #fff 55%, #ecf4fb 92%, transparent 100%),
    radial-gradient(ellipse 20% 46% at 75% 60%, #fff 55%, #eaf3fa 92%, transparent 100%),
    radial-gradient(ellipse 46% 30% at 50% 74%, #fff 60%, #e8f1f9 94%, transparent 100%);
  filter: drop-shadow(0 18px 22px rgba(50, 100, 150, 0.16));
  opacity: 0.95;
}

/* ---------- דגלים (משותף) ---------- */
.flag { position: relative; height: 100%; filter: drop-shadow(0 10px 14px rgba(20, 30, 60, 0.18)); }
.flag-strip { position: absolute; top: 0; bottom: 0; will-change: transform; }
.flag-strip svg { display: block; width: 100%; height: 100%; }
.flag-shade { position: absolute; inset: 0; pointer-events: none; }

/* ---------- מסך הכניסה ---------- */
.gate {
  position: relative;
  min-height: 100svh;
  overflow: hidden;
  display: grid;
  place-items: center;
  padding-block: max(28px, calc(env(safe-area-inset-top, 0px) + 20px)) max(28px, calc(env(safe-area-inset-bottom, 0px) + 20px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background:
    radial-gradient(55% 45% at 72% 16%, rgba(255, 255, 255, 0.7), transparent 70%),
    radial-gradient(40% 35% at 20% 85%, rgba(255, 244, 214, 0.55), transparent 70%),
    linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 52%, #eef7fd 100%);
}
.gate-layer { position: absolute; inset: 0; pointer-events: none; }
.gate-plane { position: absolute; z-index: 2; pointer-events: none; }
.gate-plane--yellow { width: clamp(170px, 26vw, 380px); top: 7%; right: 3%; }
.gate-plane--mint { width: clamp(120px, 16vw, 240px); bottom: 9%; left: 5%; }
.gate-plane--white { width: clamp(70px, 8vw, 120px); top: 30%; left: 12%; opacity: 0.9; }
.gp-mirror { transform: scaleX(-1); }
.gate-plane--yellow .gp-float { transform: rotate(-12deg); }
.gate-plane--mint .gp-float { transform: rotate(-9deg); }
.gate-trail { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
.gate-trail polyline { fill: none; stroke: rgba(255, 255, 255, 0.95); stroke-width: 2.5; stroke-dasharray: 3 9; stroke-linecap: round; filter: drop-shadow(0 2px 4px rgba(30, 70, 120, 0.25)); }
.gate-content { position: relative; z-index: 4; width: 100%; display: grid; place-items: center; }

.gate-card {
  width: min(100%, 420px);
  border-radius: 34px;
  padding: 30px 26px 26px;
  text-align: center;
  animation: card-in 0.9s cubic-bezier(.16, 1, .3, 1) both;
}
.gate-card--wide { width: min(100%, 470px); }
@keyframes card-in {
  from { opacity: 0; transform: translateY(18px) scale(.98); filter: blur(8px); }
  to { opacity: 1; transform: none; filter: none; }
}
.gate-eyebrow { margin: 0 0 6px; font-size: 14px; font-weight: 600; color: var(--h-soft); }
.gate-title {
  margin: 0;
  font-size: clamp(36px, 9vw, 50px);
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: -0.03em;
  text-wrap: balance;
}
.gate-title--sm { font-size: clamp(30px, 7.5vw, 40px); }
.gate-title .dot { color: var(--paper-yellow); }
.gate-lede { margin: 12px auto 24px; max-width: 30ch; font-size: 17px; line-height: 1.5; color: var(--h-soft); }
.gate-note { margin: 14px 0 0; font-size: 13px; color: var(--h-soft); }
.gate-error { margin: 12px 0 0; color: #b3261e; font-weight: 600; font-size: 14px; }
.demo-pill {
  display: inline-block; margin-bottom: 14px; padding: 4px 12px; border-radius: 999px;
  background: rgba(29, 29, 31, 0.06); color: var(--h-soft); font-size: 12px; font-weight: 600;
}
.gate-links { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 12px; color: var(--h-soft); }
.gate-skip {
  position: fixed; z-index: 5;
  bottom: max(22px, calc(env(safe-area-inset-bottom, 0px) + 14px)); left: 50%; transform: translateX(-50%);
  padding: 10px 20px; border-radius: 999px; background: rgba(255, 255, 255, 0.55);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}

/* סמל הדגלים המוצלבים */
.emblem { position: relative; height: 78px; width: 200px; margin: 2px auto 16px; }
.mini-pole {
  position: absolute; bottom: 0; left: 50%;
  width: 3px; height: 76px; margin-left: -1.5px; border-radius: 2px;
  background: linear-gradient(90deg, #b9bec6, #f4f6f8 45%, #9aa1ab);
  transform-origin: 50% 100%;
}
.mini-pole--left { transform: rotate(-14deg); }
.mini-pole--right { transform: rotate(14deg); }
.mini-cap {
  position: absolute; top: -5px; left: 50%; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff5c9, #e8b931 55%, #a87a12);
}
.mini-mount { position: absolute; top: 3px; height: 32px; }
.mini-mount--right { left: 2px; width: 48px; }
.mini-mount--left { right: 2px; width: 60.8px; transform: scaleX(-1); transform-origin: 50% 50%; }

/* כפתורים */
.btn-google {
  display: inline-flex; align-items: center; justify-content: center; gap: 12px;
  width: 100%; min-height: 56px; padding: 0 22px;
  border-radius: 999px; border: 1px solid rgba(29, 29, 31, 0.08);
  background: #fff; font-weight: 600; font-size: 17px; color: var(--h-ink);
  box-shadow: 0 1px 0 #fff inset, 0 10px 26px rgba(30, 60, 100, 0.14);
  transition: transform .2s ease, box-shadow .2s ease;
}
.btn-google:hover { transform: translateY(-1px); box-shadow: 0 14px 34px rgba(30, 60, 100, 0.2); }
.btn-google:disabled { opacity: .75; cursor: progress; transform: none; }
.btn-google svg { width: 22px; height: 22px; flex: none; }
.pill-btn {
  min-height: 48px; padding: 0 24px; border-radius: 999px; font-weight: 600; font-size: 16px;
  border: 1px solid var(--h-line); background: #fff; color: var(--h-ink);
  transition: transform 0.2s ease, background-color 0.2s ease;
}
.pill-btn:hover { transform: translateY(-1px); }
.pill-btn:disabled { opacity: .6; cursor: progress; }
.pill-btn--dark { background: var(--h-ink); color: #fff; border-color: var(--h-ink); }
.pill-btn--block { width: 100%; min-height: 54px; margin-top: 20px; font-size: 17px; }
.text-btn { background: none; border: 0; padding: 6px 4px; font-size: 14px; font-weight: 500; color: var(--h-soft); }
.text-btn:hover { color: var(--h-ink); }

.spinner {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2.5px solid rgba(29, 29, 31, 0.15); border-top-color: var(--h-ink);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-chip { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; border-radius: 999px; font-weight: 600; color: var(--h-soft); }

/* אנשים, תמונות והזמנה */
.people { display: flex; justify-content: center; gap: 22px; margin-top: 20px; }
.person { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.person-face {
  width: 58px; height: 58px; border-radius: 50%;
  background: linear-gradient(145deg, #fff, #eef3f8) center/cover no-repeat;
  border: 2px solid #fff;
  box-shadow: 0 8px 20px rgba(30, 60, 100, 0.14);
  display: grid; place-items: center;
  font-weight: 700; font-size: 22px; color: var(--h-soft);
}
.person-name { font-weight: 600; font-size: 15px; }
.person-upload { font-size: 12.5px; font-weight: 600; color: var(--gold); cursor: pointer; }
.person-upload:hover { text-decoration: underline; }
.sr-file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.invite { display: flex; gap: 8px; margin-top: 18px; }
.invite input {
  flex: 1; min-width: 0; min-height: 48px; padding: 0 16px;
  border-radius: 999px; border: 1px solid var(--h-line); background: rgba(255, 255, 255, 0.85);
  direction: ltr; text-align: right;
}

/* ---------- שעונים מחוגים ---------- */
.aclocks { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 22px 0 0; }
.aclock { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.dial { width: clamp(96px, 26vw, 118px); height: auto; filter: drop-shadow(0 12px 22px rgba(30, 60, 100, 0.14)); }
.dial-face { fill: rgba(255, 255, 255, 0.82); stroke: rgba(255, 255, 255, 1); stroke-width: 1.5; }
.tick { stroke: rgba(29, 29, 31, 0.25); stroke-width: 1.2; stroke-linecap: round; }
.tick--major { stroke: rgba(29, 29, 31, 0.6); stroke-width: 2.2; }
.hand { stroke-linecap: round; }
.hand--hour { stroke: var(--h-ink); stroke-width: 3.6; }
.hand--min { stroke: var(--h-ink); stroke-width: 2.4; }
.hand--sec { stroke: #e0a020; stroke-width: 1.1; }
.dial--accent .hand--hour, .dial--accent .hand--min { stroke: #2b2b2f; }
.dial--accent .dial-face { fill: rgba(255, 249, 230, 0.9); }
.dial-pin { fill: #e0a020; }
.aclock figcaption { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.aclock-city { font-size: 13px; font-weight: 600; color: var(--h-soft); }
.aclock-time { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; direction: ltr; }
.aclock-time--accent { color: var(--gold); }
.aclock-day { font-size: 12px; color: var(--h-soft); }

@media (max-width: 640px) {
  .gate-plane--yellow { top: 3%; right: -6%; }
  .gate-plane--mint { bottom: 3%; left: -4%; }
  .gate-plane--white { top: 20%; left: 2%; }
}
@media (prefers-reduced-motion: reduce) {
  .gate-card { animation: none; }
}

/* עמוד הבית — "קליפורניה." בקו נקי ומואר.
   פריסה: סיפור גלילה אנכי. שמיים בהירים ← דגלים על לבן ← מסלול טיסה ננעץ ← כרטיסי זכוכית על אורות צבעוניים ← סיום. */
.home {
  background: var(--h-bg);
  color: var(--h-ink);
  font-family: var(--font-home);
  overflow-x: clip;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body:has(.home) { background: #fbfbfd; overflow: auto; }


/* ---------- טיפוגרפיה ---------- */
.eyebrow-home {
  margin: 0 0 14px;
  font-size: clamp(15px, 1.6vw, 19px);
  font-weight: 600;
  color: var(--h-soft);
  letter-spacing: 0.01em;
}
.hero-title {
  margin: 0;
  font-size: clamp(76px, 17vw, 210px);
  font-weight: 800;
  line-height: 0.95;
  letter-spacing: -0.035em;
  color: var(--h-ink);
}
.hero-title .dot { color: var(--paper-yellow); }
.section-title {
  margin: 0;
  font-size: clamp(44px, 8vw, 104px);
  font-weight: 800;
  line-height: 1.02;
  letter-spacing: -0.03em;
  text-wrap: balance;
}
.lede {
  margin: 20px auto 0;
  max-width: 34ch;
  font-size: clamp(19px, 2.2vw, 26px);
  font-weight: 500;
  line-height: 1.45;
  color: var(--h-soft);
  text-wrap: pretty;
}
.section { padding-block: clamp(96px, 14vw, 180px); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); position: relative; }
.section-head { text-align: center; max-width: 900px; margin-inline: auto; position: relative; z-index: 2; }

/* ---------- סרגל עליון ---------- */
.nav {
  position: fixed;
  inset: 0 0 auto;
  z-index: 50;
  padding-top: env(safe-area-inset-top, 0px);
  background: rgba(251, 251, 253, 0.68);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--h-line);
}
.nav-inner {
  height: 52px;
  max-width: 1080px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.nav-brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; color: var(--h-ink); text-decoration: none; }
.nav .nav-plane { width: 30px; height: auto; transform: scaleX(-1); filter: none; }
.nav-side { display: flex; align-items: center; gap: 12px; }
.nav-demo { font-size: 12px; font-weight: 600; color: var(--h-soft); padding: 3px 10px; border-radius: 999px; background: rgba(29, 29, 31, 0.05); }
.nav-faces { display: flex; }
.nav-face {
  width: 28px; height: 28px; border-radius: 50%;
  margin-inline-start: -8px;
  border: 2px solid var(--h-bg);
  background: #f3e2d6 center/cover no-repeat;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 700; color: #b06a5f;
}
.nav-face:first-child { margin-inline-start: 0; }
.nav-link { background: none; border: 0; padding: 6px 2px; font-size: 14px; color: var(--h-ink); opacity: 0.8; }
.nav-link:hover { opacity: 1; }

/* ---------- פתיחה ---------- */
.hero {
  position: relative;
  min-height: 100svh;
  display: grid;
  place-items: center;
  overflow: hidden;
  padding: 120px max(20px, env(safe-area-inset-right, 0px)) 120px max(20px, env(safe-area-inset-left, 0px));
  background:
    radial-gradient(60% 50% at 70% 18%, rgba(255, 255, 255, 0.65), transparent 70%),
    linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 46%, #eef7fd 78%, var(--h-bg) 100%);
}
.hero-copy { position: relative; z-index: 3; text-align: center; will-change: transform, opacity; }
.hero-pill {
  display: inline-flex; align-items: center; gap: 10px;
  margin-top: 30px; padding: 12px 22px; border-radius: 999px;
  font-size: 15px; font-weight: 600; color: var(--h-ink);
}
.pill-dot { width: 8px; height: 8px; border-radius: 50%; background: #34c759; box-shadow: 0 0 0 4px rgba(52, 199, 89, 0.18); }

.hero-plane { position: absolute; z-index: 2; will-change: transform; }
.hero-plane--yellow { width: clamp(180px, 30vw, 420px); top: 15%; right: 4%; }
.hero-plane--mint { width: clamp(130px, 19vw, 270px); bottom: 17%; left: 6%; }
.hero-plane--yellow .origami-svg { transform: scaleX(-1) rotate(-14deg); }
.hero-plane--mint .origami-svg { transform: rotate(-10deg); }



.scroll-cue {
  position: absolute; bottom: max(28px, env(safe-area-inset-bottom, 0px)); left: 50%;
  width: 26px; height: 42px; margin-left: -13px;
  border: 2px solid rgba(29, 29, 31, 0.28); border-radius: 14px; z-index: 3;
}
.scroll-cue span {
  position: absolute; top: 8px; left: 50%; width: 4px; height: 8px; margin-left: -2px;
  border-radius: 2px; background: rgba(29, 29, 31, 0.45);
  animation: cue 1.8s ease-in-out infinite;
}
@keyframes cue { 0% { transform: translateY(0); opacity: 1; } 70% { transform: translateY(12px); opacity: 0; } 100% { opacity: 0; } }

/* ---------- דגלים ---------- */
.flags { background: var(--h-bg); }
.flag-stage {
  margin: clamp(56px, 8vw, 96px) auto 0;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: clamp(8px, 4vw, 64px);
  --fh: clamp(66px, 14vw, 150px);
}
/* כל תורן תופס רוחב של הדגל שלו, כדי שהדגלים לא יעלו זה על זה */
.pole-rig { direction: ltr; position: relative; display: flex; flex-direction: column; align-items: flex-start; width: calc(var(--fh) * var(--ratio) + 14px); }
.pole {
  position: relative;
  width: 7px;
  height: calc(var(--fh) * 3.1);
  border-radius: 4px;
  background: linear-gradient(90deg, #b9bec6, #f4f6f8 45%, #9aa1ab);
  box-shadow: 0 30px 40px -20px rgba(0, 0, 0, 0.25);
}
.pole-cap {
  position: absolute; top: -11px; left: 50%; width: 15px; height: 15px; margin-left: -7.5px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff5c9, #e8b931 55%, #a87a12);
}
.flag-mount { position: absolute; top: 10px; left: 6px; height: var(--fh); will-change: transform; }
.flag-caption { direction: rtl; margin: 18px 0 0; font-size: 15px; font-weight: 600; color: var(--h-soft); }

/* ---------- המסע ---------- */
.journey {
  min-height: 100svh;
  display: grid;
  place-items: center;
  background: linear-gradient(180deg, var(--h-bg), #f1f7fc 50%, var(--h-bg));
  padding-block: 90px 40px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.journey-inner { width: min(100%, 1100px); }
.journey-map { position: relative; margin-top: clamp(16px, 4vw, 40px); }
.journey-svg { display: block; width: 100%; height: auto; transform: scaleX(-1); overflow: visible; }
.journey-ghost { fill: none; stroke: rgba(29, 29, 31, 0.12); stroke-width: 2; stroke-dasharray: 2 12; stroke-linecap: round; }
.journey-path { fill: none; stroke: var(--paper-yellow); stroke-width: 3.5; stroke-linecap: round; }
.journey-dot { fill: var(--h-ink); }
.journey-end { fill: var(--paper-yellow); transform-box: fill-box; transform-origin: center; }
.journey-plane { filter: drop-shadow(0 10px 12px rgba(30, 70, 120, 0.25)); }
.journey-label {
  position: absolute; bottom: -6px;
  display: flex; flex-direction: column; align-items: center;
  font-size: clamp(15px, 2vw, 22px); font-weight: 700;
}
.journey-label small { font-size: 0.7em; font-weight: 600; color: var(--h-soft); letter-spacing: 0.12em; }
.journey-label--from { right: 0; transform: translateX(30%); }
.journey-label--to { left: 0; transform: translateX(-30%); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(10px, 2vw, 20px); margin-top: clamp(40px, 6vw, 70px); }
.stat { border-radius: 24px; padding: clamp(16px, 2.6vw, 28px) 12px; text-align: center; display: flex; flex-direction: column; gap: 6px; }
.stat-num { font-size: clamp(30px, 5vw, 60px); font-weight: 800; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.stat-label { font-size: clamp(13px, 1.4vw, 16px); color: var(--h-soft); font-weight: 500; }

/* ---------- כרטיסי זכוכית ---------- */
.features { overflow: hidden; background: var(--h-bg); }
.blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.75; z-index: 0; will-change: transform; }
.blob--yellow { width: 42vw; height: 42vw; background: #ffe58f; top: 18%; right: -8%; }
.blob--mint { width: 36vw; height: 36vw; background: #b6ecc8; bottom: 6%; left: -6%; }
.blob--sky { width: 30vw; height: 30vw; background: #b9e0fa; top: 44%; left: 30%; }
.blob--lilac { width: 26vw; height: 26vw; background: #ddd0f0; top: 8%; left: 6%; }
.feature-grid {
  position: relative; z-index: 2;
  max-width: 1080px;
  margin: clamp(48px, 7vw, 80px) auto 0;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  gap: 18px;
  perspective: 1200px;
}
.feature { border-radius: 28px; padding: 26px 26px 28px; min-width: 0; transform-origin: 50% 100%; }
.feature-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 26px; }
.feature-badge {
  width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center;
  background: rgba(255, 255, 255, 0.85); color: var(--h-ink);
  box-shadow: 0 6px 16px rgba(30, 60, 100, 0.1);
}
.feature-icon { width: 24px; height: 24px; }
.feature-status { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; color: #8a6a10; background: rgba(247, 201, 72, 0.3); }
.feature h3 { margin: 0 0 8px; font-size: 24px; font-weight: 700; letter-spacing: -0.015em; }
.feature p { margin: 0; font-size: 16px; line-height: 1.55; color: #48484d; }

/* ---------- סיום ---------- */
.finale { text-align: center; overflow: hidden; background: linear-gradient(180deg, var(--h-bg), #eef7fd); }
.finale-plane { position: absolute; width: clamp(110px, 14vw, 190px); z-index: 1; pointer-events: none; }
.finale-plane--a { top: 12%; right: 10%; }
.finale-plane--a .origami-svg { transform: scaleX(-1); }
.finale-plane--b { bottom: 22%; left: 8%; }
.finale-clocks { max-width: 420px; margin: 40px auto 0; position: relative; z-index: 2; padding: 22px 16px 18px; border-radius: 30px; }
.finale-clocks .aclocks { margin: 0; }
.finale-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 34px; position: relative; z-index: 2; }
.footer-note { margin: 70px 0 0; font-size: 13px; color: var(--h-soft); }

@media (max-width: 640px) {
  .hero-plane--yellow { top: 11%; right: -4%; }
  .hero-plane--mint { bottom: 13%; left: -2%; }
  .stats { grid-template-columns: 1fr; }
  .stat { flex-direction: row; justify-content: space-between; align-items: center; padding: 16px 20px; text-align: start; }
  .nav-demo { display: none; }
}
