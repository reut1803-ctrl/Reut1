<title>קליפורניה שלנו</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Fredoka:wght@500;600&display=swap">
<style>
/* קליפורניה שלנו — שער כניסה
   פריסה: סצנה מאוירת שממלאת את כל המסך, וכרטיס זכוכית פסטלי שצף מעליה.
   עיצוב בהיר בלבד (בכוונה). "מצב לילה" סגול עמום יגיע בהמשך כמצב חיסכון סוללה. */
:root {
  color-scheme: light;
  --cream: #fbf5ec;
  --blush: #efc0b3;
  --blush-deep: #c97f76;
  --peach: #f6caa6;
  --sage: #b3c6a6;
  --sage-deep: #6f8a66;
  --lilac: #bbaed0;
  --lilac-deep: #7c6c93;
  --ink: #4f3f4b;
  --ink-soft: #7d6b75;
  --sky-top: #f2d2cb;
  --sky-bottom: #fcefe2;
  --plane: #fffcf7;
  --card: rgba(255, 251, 246, 0.8);
  --card-line: rgba(124, 108, 147, 0.16);
  --skin: #f3d2bd;
  --hair: #8a6553;
  --runway: #cdbfc4;

  --font-display: "Fredoka", "Varela Round", "Assistant", system-ui, sans-serif;
  --font-body: "Assistant", "Heebo", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--sky-top);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--lilac-deep); outline-offset: 3px; }

/* ---------- מבנה המסך ---------- */
.stage {
  position: relative;
  height: 100svh;
  width: 100%;
  overflow: hidden;
  background: linear-gradient(var(--sky-top), var(--sky-bottom));
}
.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-top: max(28px, calc(env(safe-area-inset-top, 0px) + 20px));
  padding-bottom: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.overlay--center { align-items: center; padding-bottom: 22vh; }
.overlay > * { pointer-events: auto; }
/* במסך רחב: כרטיס הברוכים-הבאים זז לצד השמאלי, מעל הגשר, כדי לא להסתיר את המטוס */
@media (min-width: 900px) and (min-aspect-ratio: 1/1) {
  .overlay--side { justify-content: flex-end; padding-left: max(40px, env(safe-area-inset-left, 0px)); }
}

/* ---------- כרטיסים ---------- */
.card {
  width: min(100%, 420px);
  background: var(--card);
  border: 1px solid var(--card-line);
  border-radius: 28px;
  padding: 28px 24px 24px;
  box-shadow: 0 18px 50px rgba(124, 108, 147, 0.16);
  backdrop-filter: blur(14px) saturate(1.1);
  -webkit-backdrop-filter: blur(14px) saturate(1.1);
  text-align: center;
  animation: card-in 0.7s cubic-bezier(.2, .8, .2, 1) both;
  max-height: calc(100svh - 48px);
  overflow-y: auto;
}
@keyframes card-in {
  from { opacity: 0; transform: translateY(14px) scale(.98); }
  to { opacity: 1; transform: none; }
}
.eyebrow {
  margin: 0 0 6px;
  font-size: 13px;
  letter-spacing: .06em;
  color: var(--sage-deep);
  font-weight: 600;
}
.title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(30px, 8vw, 40px);
  line-height: 1.1;
  color: var(--ink);
  text-wrap: balance;
}
.title em { font-style: normal; color: var(--blush-deep); }
.lead { margin: 10px auto 22px; max-width: 32ch; color: var(--ink-soft); line-height: 1.55; }

.btn-google {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 0 20px;
  border-radius: 999px;
  border: 1px solid rgba(79, 63, 75, 0.14);
  background: #fff;
  font-weight: 700;
  font-size: 17px;
  box-shadow: 0 4px 14px rgba(201, 127, 118, 0.18);
  transition: transform .15s ease, box-shadow .15s ease;
}
.btn-google:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(201, 127, 118, 0.26); }
.btn-google:disabled { opacity: .7; cursor: progress; transform: none; }
.btn-google svg { width: 22px; height: 22px; flex: none; }

.btn {
  min-height: 44px;
  padding: 0 18px;
  border-radius: 999px;
  border: 1px solid transparent;
  font-weight: 700;
  transition: background-color .15s ease, transform .15s ease;
}
.btn-primary { background: var(--blush-deep); color: #fff; }
.btn-primary:hover { background: #b96f66; }
.btn-soft { background: rgba(187, 174, 208, 0.25); color: var(--lilac-deep); }
.btn-soft:hover { background: rgba(187, 174, 208, 0.4); }
.btn-ghost { background: transparent; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 3px; }
.btn:disabled { opacity: .6; cursor: progress; }

.note { margin: 14px 0 0; font-size: 13px; color: var(--ink-soft); }
.error { margin: 12px 0 0; color: #a5514a; font-weight: 600; font-size: 14px; }
.demo-pill {
  display: inline-block;
  margin-bottom: 12px;
  padding: 4px 12px;
  border-radius: 999px;
  background: rgba(179, 198, 166, 0.35);
  color: var(--sage-deep);
  font-size: 12px;
  font-weight: 700;
}

.spinner {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2.5px solid rgba(124, 108, 147, 0.25);
  border-top-color: var(--lilac-deep);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-chip {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 10px 18px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--card-line);
  font-weight: 600; color: var(--ink-soft);
}

.skip {
  position: absolute;
  bottom: max(18px, calc(env(safe-area-inset-bottom, 0px) + 12px));
  left: max(16px, env(safe-area-inset-left, 0px));
  pointer-events: auto;
}

/* ---------- כרטיס ברוכים הבאים ---------- */
.clocks {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 18px 0 16px;
}
.clock {
  background: rgba(255, 255, 255, 0.6);
  border: 1px solid var(--card-line);
  border-radius: 18px;
  padding: 10px 8px;
}
.clock-label { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
.clock-time {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  direction: ltr;
}
.clock-day { font-size: 12px; color: var(--ink-soft); }
.clock--ca .clock-time { color: var(--blush-deep); }

.members { display: flex; flex-direction: column; gap: 10px; text-align: start; }
.member {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.55);
  border: 1px solid var(--card-line);
}
.member-face {
  width: 46px; height: 46px; flex: none; border-radius: 50%;
  background: var(--skin) center/cover no-repeat;
  border: 2px solid #fff;
  box-shadow: 0 0 0 2px var(--blush);
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 600; color: var(--blush-deep);
}
.member-body { flex: 1; min-width: 0; }
.member-name { font-weight: 700; }
.member-sub { font-size: 13px; color: var(--ink-soft); }
.member-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip {
  padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
  border: 1px solid var(--card-line); background: #fff; color: var(--ink-soft);
}
.chip[aria-pressed="true"] { background: var(--lilac); color: #fff; border-color: var(--lilac); }
.chip-upload { background: rgba(246, 202, 166, 0.45); color: var(--ink); border-color: transparent; }
.sr-file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

.invite { display: flex; gap: 8px; margin-top: 12px; }
.invite input {
  flex: 1; min-width: 0; min-height: 44px; padding: 0 14px;
  border-radius: 999px; border: 1px solid var(--card-line); background: #fff;
  direction: ltr; text-align: right;
}
.welcome-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }

/* ---------- הסצנה ---------- */
.sky { fill: url(#skyGrad); }
.sun { fill: var(--peach); }
.cloud { fill: #fffaf4; opacity: .92; }
.drift-a { animation: drift 46s ease-in-out infinite alternate; }
.drift-b { animation: drift 60s ease-in-out infinite alternate-reverse; }
.drift-c { animation: drift 38s ease-in-out infinite alternate; }
@keyframes drift { from { translate: -26px 0; } to { translate: 26px 0; } }
.hills-far { fill: #dccfe0; }
.bridge rect, .bridge path { fill: none; stroke: #c6a9b8; stroke-width: 2; }
.bridge rect { fill: #c6a9b8; stroke: none; }
.hills-near { fill: #c9d8bd; }
.tower rect, .tower path { fill: #e7dbe4; }
.tower .tower-glass { fill: var(--lilac); }
.tower-label { fill: var(--lilac-deep); font: 700 7px var(--font-display); text-anchor: middle; letter-spacing: .08em; }
.palm path { fill: var(--sage-deep); opacity: .75; }
.palm .palm-trunk { fill: none; stroke: #a98f86; stroke-width: 4; stroke-linecap: round; opacity: 1; }
.runway { fill: var(--runway); }
.runway-line { stroke: #fff; stroke-width: 2.5; stroke-dasharray: 18 16; opacity: .85; }
.grass { fill: var(--sage); }
.poppy line { stroke: var(--sage-deep); stroke-width: 1.4; }
.poppy circle { fill: #f2a77f; }

.fuselage { fill: var(--plane); stroke: rgba(124, 108, 147, .18); stroke-width: 1; }
.stripe { fill: var(--peach); }
.belly { fill: #f6ede6; }
.tail { fill: var(--lilac); }
.tail-heart { fill: var(--blush); }
.stabilizer { fill: var(--lilac-deep); opacity: .7; }
.window { fill: #8fa785; }
.wing { fill: var(--blush); }
.engine { fill: #efe3dc; stroke: rgba(124, 108, 147, .2); }
.gear { stroke: #9a8a93; stroke-width: 3; }
.wheel { fill: #5f5059; }
.door-gap { fill: #6b5867; }
.door { fill: var(--plane); stroke: rgba(124, 108, 147, .35); stroke-width: 1; transform-box: fill-box; transform-origin: 0% 50%; }
.stairs-side { fill: var(--lilac); }
.stair { stroke: var(--lilac-deep); stroke-width: 2.2; stroke-linecap: round; }
.stairs-rail { stroke: var(--lilac-deep); stroke-width: 1.6; stroke-linecap: round; }
.plane-shadow { fill: #8d7b88; opacity: .3; transform-box: fill-box; transform-origin: 50% 50%; }
.puff { fill: #fff; opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; }

/* דמויות */
.avatar .leg { stroke: var(--ink); stroke-width: 3.2; stroke-linecap: round; transform-box: view-box; }
.avatar .leg-l { transform-origin: -3.6px -12px; }
.avatar .leg-r { transform-origin: 3.6px -12px; }
.avatar .arm { stroke: var(--skin); stroke-width: 3; stroke-linecap: round; }
.avatar .arm-wave { transform-origin: 8.5px -21px; }
.avatar .neck-skin { fill: var(--skin); }
.avatar .head-ring { fill: none; stroke: #fff; stroke-width: 1.6; }
.avatar .eye { fill: var(--ink); }
.avatar .cheek { fill: var(--blush); opacity: .8; }
.avatar .smile { fill: none; stroke: var(--ink); stroke-width: 1.2; stroke-linecap: round; }
.avatar .beard { fill: var(--hair); display: none; }
.avatar.look-kippah .beard { display: inline; }
.avatar .acc-hat path, .avatar .acc-hat ellipse { fill: #f6e3c8; stroke: #e2c9a8; stroke-width: .8; }
.avatar .acc-hat .hat-band { fill: var(--blush); }
.avatar .acc-kippah { fill: var(--lilac-deep); }
.avatar.look-hat .acc-kippah, .avatar.look-kippah .acc-hat { display: none; }
.avatar:not(.has-photo) .avatar-photo { display: none; }
.avatar.has-photo .face { display: none; }

/* ---------- הכוריאוגרפיה של הנחיתה ---------- */
.scene .plane, .scene .stairs, .scene .walker { opacity: 0; }
.scene .walker { transform: translate(375px, 370px); }

.scene--landing .plane { animation: plane-land 3.6s cubic-bezier(.3, .55, .35, 1) both; }
.scene--landing .plane-shadow { animation: shadow-land 3.6s cubic-bezier(.3, .55, .35, 1) both; }
.scene--landing .puff-1 { animation: puff 1.1s 1.95s ease-out both; }
.scene--landing .puff-2 { animation: puff 1.2s 2.05s ease-out both; }
.scene--landing .puff-3 { animation: puff 1s 2.1s ease-out both; }
.scene--landing .door { animation: door-open .5s 3.8s ease-in-out both; }
.scene--landing .stairs { animation: stairs-in .6s 4.15s cubic-bezier(.2, .8, .2, 1) both; }
.scene--landing .walker-0 { animation: walk-0 3.4s 4.8s linear both; }
.scene--landing .walker-1 { animation: walk-1 3.4s 5.5s linear both; }
.scene--landing .walker-0 .bob { animation: bob .34s 4.8s ease-in-out 10 alternate; }
.scene--landing .walker-1 .bob { animation: bob .34s 5.5s ease-in-out 10 alternate; }
.scene--landing .walker-0 .leg-l { animation: step .34s 4.8s ease-in-out 10 alternate; }
.scene--landing .walker-0 .leg-r { animation: step .34s 4.8s ease-in-out 10 alternate-reverse; }
.scene--landing .walker-1 .leg-l { animation: step .34s 5.5s ease-in-out 10 alternate; }
.scene--landing .walker-1 .leg-r { animation: step .34s 5.5s ease-in-out 10 alternate-reverse; }
.scene--landing .walker-0 .arm-wave { animation: wave .45s 8.3s ease-in-out 6 alternate; }
.scene--landing .walker-1 .arm-wave { animation: wave .45s 9s ease-in-out 6 alternate; }

/* מצב "הגענו": כל החלקים במקומם הסופי, בלי לחכות */
.scene--arrived .plane, .scene--arrived .stairs { opacity: 1; }
.scene--arrived .door { transform: scaleX(0); }
.scene--arrived .walker { opacity: 1; }
.scene--arrived .walker-0 { transform: translate(340px, 470px) scale(2.3); }
.scene--arrived .walker-1 { transform: translate(430px, 474px) scale(2.3); }
.scene--arrived .walker .arm-wave { animation: wave .5s ease-in-out 4 alternate; }

@keyframes plane-land {
  0%   { opacity: 1; transform: translate(-700px, -420px) rotate(5deg); }
  55%  { transform: translate(-190px, -3px) rotate(-4deg); }
  60%  { transform: translate(-160px, 0) rotate(-2.5deg); }
  72%  { transform: translate(-70px, 0) rotate(0deg); }
  100% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
}
@keyframes shadow-land {
  0%   { opacity: 0; transform: translateX(-560px) scaleX(.3); }
  50%  { opacity: .2; transform: translateX(-210px) scaleX(.8); }
  60%  { opacity: .32; transform: translateX(-160px) scaleX(1); }
  100% { opacity: .32; transform: translateX(0) scaleX(1); }
}
@keyframes puff {
  0%   { opacity: .9; transform: translate(0, 0) scale(.2); }
  100% { opacity: 0; transform: translate(-26px, -10px) scale(2.2); }
}
@keyframes door-open { to { transform: scaleX(0); } }
@keyframes stairs-in {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: none; }
}
@keyframes walk-0 {
  0%   { opacity: 0; transform: translate(375px, 371px) scale(1); }
  8%   { opacity: 1; transform: translate(375px, 371px) scale(1); }
  18%  { transform: translate(363px, 371px) scale(1); }
  52%  { transform: translate(303px, 404px) scale(1.1); }
  100% { opacity: 1; transform: translate(340px, 470px) scale(2.3); }
}
@keyframes walk-1 {
  0%   { opacity: 0; transform: translate(375px, 371px) scale(1); }
  8%   { opacity: 1; transform: translate(375px, 371px) scale(1); }
  18%  { transform: translate(363px, 371px) scale(1); }
  52%  { transform: translate(303px, 404px) scale(1.1); }
  100% { opacity: 1; transform: translate(430px, 474px) scale(2.3); }
}
@keyframes bob { from { translate: 0 0; } to { translate: 0 -1.6px; } }
@keyframes step { from { rotate: -16deg; } to { rotate: 16deg; } }
@keyframes wave { from { rotate: 0deg; } to { rotate: -70deg; } }

@media (prefers-reduced-motion: reduce) {
  .drift-a, .drift-b, .drift-c { animation: none; }
  .card { animation: none; }
}

html, body { height: 100%; }
.stage { height: 100%; min-height: 560px; }
</style>

      <div class="clock"><div class="clock-label">ובבית, בישראל</div><div class="clock-time" id="il-time">--:--</div><div class="clock-day" id="il-day"></div></div>

<script>
(function () {
  var svg = document.querySelector('.scene');
  var overlay = document.getElementById('overlay');
  var login = document.getElementById('login-card');
  var welcome = document.getElementById('welcome-card');
  var skip = document.getElementById('skip-btn');
  var gBtn = document.getElementById('google-btn');
  var timer = null;

  var people = [
    { name: 'רעות', look: 'hat', photo: null },
    { name: 'זכריה', look: 'kippah', photo: null }
  ];

  function fitView() {
    var tall = window.innerWidth / Math.max(1, window.innerHeight) <= 1;
    svg.setAttribute('viewBox', tall ? '280 250 380 250' : '130 100 560 400');
  }
  fitView();
  window.addEventListener('resize', fitView);

  function setPhase(p) {
    svg.classList.remove('scene--idle', 'scene--landing', 'scene--arrived');
    void svg.getBoundingClientRect();
    svg.classList.add('scene--' + p);
  }

  function paintAvatars() {
    people.forEach(function (p, i) {
      var g = svg.querySelector('[data-avatar="' + i + '"]');
      g.classList.toggle('look-hat', p.look === 'hat');
      g.classList.toggle('look-kippah', p.look === 'kippah');
      g.classList.toggle('has-photo', !!p.photo);
      g.querySelector('.avatar-photo').setAttribute('href', p.photo || '');
    });
  }

  function fmt(d, tz) {
    return {
      t: new Intl.DateTimeFormat('he-IL', { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false }).format(d),
      d: new Intl.DateTimeFormat('he-IL', { timeZone: tz, weekday: 'long', day: 'numeric', month: 'long' }).format(d)
    };
  }
  function tick() {
    var n = new Date(), ca = fmt(n, 'America/Los_Angeles'), il = fmt(n, 'Asia/Jerusalem');
    document.getElementById('ca-time').textContent = ca.t;
    document.getElementById('ca-day').textContent = ca.d;
    document.getElementById('il-time').textContent = il.t;
    document.getElementById('il-day').textContent = il.d;
  }
  setInterval(tick, 15000); tick();

  function renderMembers() {
    var box = document.getElementById('members');
    box.innerHTML = '';
    people.forEach(function (p, i) {
      var row = document.createElement('div'); row.className = 'member';
      var face = document.createElement('div'); face.className = 'member-face';
      if (p.photo) face.style.backgroundImage = 'url("' + p.photo + '")'; else face.textContent = p.name.slice(0, 1);
      var body = document.createElement('div'); body.className = 'member-body';
      var nm = document.createElement('div'); nm.className = 'member-name'; nm.textContent = p.name;
      var acts = document.createElement('div'); acts.className = 'member-actions';
      var id = 'face-upload-' + i;
      var lbl = document.createElement('label'); lbl.className = 'chip chip-upload'; lbl.htmlFor = id;
      lbl.textContent = p.photo ? 'החלפת תמונת פנים' : 'העלאת תמונת פנים';
      var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.id = id; inp.className = 'sr-file';
      inp.addEventListener('change', function () {
        var f = inp.files && inp.files[0]; if (!f) return;
        squareFace(f, function (url) { p.photo = url; paintAvatars(); renderMembers(); });
      });
      acts.appendChild(lbl); acts.appendChild(inp);
      [['hat', 'כובע שמש'], ['kippah', 'כיפה וזקן']].forEach(function (l) {
        var b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
        b.textContent = l[1]; b.setAttribute('aria-pressed', String(p.look === l[0]));
        b.addEventListener('click', function () { p.look = l[0]; paintAvatars(); renderMembers(); });
        acts.appendChild(b);
      });
      body.appendChild(nm); body.appendChild(acts);
      row.appendChild(face); row.appendChild(body);
      box.appendChild(row);
    });
  }

  function squareFace(file, done) {
    var r = new FileReader();
    r.onload = function () {
      var img = new Image();
      img.onload = function () {
        var side = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement('canvas');
        c.width = c.height = 512;
        c.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, 512, 512);
        done(c.toDataURL('image/jpeg', 0.86));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  }

  function arrive() {
    clearTimeout(timer);
    setPhase('arrived');
    skip.hidden = true;
    login.hidden = true;
    renderMembers();
    overlay.classList.remove('overlay--center');
    overlay.classList.add('overlay--side');
    welcome.hidden = false;
  }

  function land() {
    login.hidden = true; welcome.hidden = true;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { arrive(); return; }
    setPhase('landing');
    skip.hidden = false;
    timer = setTimeout(arrive, 9200);
  }

  gBtn.addEventListener('click', function () {
    gBtn.disabled = true;
    document.getElementById('g-text').textContent = 'מתחברים…';
    setTimeout(function () {
      gBtn.disabled = false;
      document.getElementById('g-text').textContent = 'כניסה עם Google';
      land();
    }, 700);
  });
  skip.addEventListener('click', arrive);
  document.getElementById('replay-btn').addEventListener('click', function () { setPhase('idle'); requestAnimationFrame(land); });
  document.getElementById('logout-btn').addEventListener('click', function () {
    clearTimeout(timer); setPhase('idle'); welcome.hidden = true; skip.hidden = true;
    overlay.classList.add('overlay--center'); overlay.classList.remove('overlay--side');
    login.hidden = false;
  });
  paintAvatars();
})();
</script>
