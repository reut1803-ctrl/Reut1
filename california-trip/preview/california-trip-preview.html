<title>קליפורניה שלנו</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Fredoka:wght@500;600&family=Heebo:wght@400;500;700&family=Noto+Sans+Hebrew:wght@400;500;600;700;800&display=swap">
<style>
/* קליפורניה שלנו — שער כניסה
   פריסה: סצנה מאוירת שממלאת את כל המסך, וכרטיס זכוכית פסטלי שצף מעליה.
   עיצוב בהיר בלבד (בכוונה). "מצב לילה" סגול עמום יגיע בהמשך כמצב חיסכון סוללה. */
:root {
  color-scheme: light;
  --cream: #fbf5ec;
  --blush: #efc0b3;
  --blush-deep: #c97f76;
  --peach: #f6caa6;
  --sage: #b3c6a6;
  --sage-deep: #6f8a66;
  --lilac: #bbaed0;
  --lilac-deep: #7c6c93;
  --ink: #4f3f4b;
  --ink-soft: #7d6b75;
  --sky-top: #f2d2cb;
  --sky-bottom: #fcefe2;
  --plane: #fffcf7;
  --card: rgba(255, 251, 246, 0.8);
  --card-line: rgba(124, 108, 147, 0.16);
  --skin: #f3d2bd;
  --hair: #8a6553;
  --runway: #cdbfc4;

  --font-display: "Fredoka", "Varela Round", "Assistant", system-ui, sans-serif;
  --font-body: "Assistant", "Heebo", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--sky-top);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--lilac-deep); outline-offset: 3px; }

/* ---------- מבנה המסך ---------- */
.stage {
  position: relative;
  height: 100svh;
  width: 100%;
  overflow: hidden;
  background: linear-gradient(var(--sky-top), var(--sky-bottom));
}
.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-top: max(28px, calc(env(safe-area-inset-top, 0px) + 20px));
  padding-bottom: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.overlay--center { align-items: center; padding-bottom: 22vh; }
.overlay > * { pointer-events: auto; }
/* במסך רחב: כרטיס הברוכים-הבאים זז לצד השמאלי, מעל הגשר, כדי לא להסתיר את המטוס */
@media (min-width: 900px) and (min-aspect-ratio: 1/1) {
  .overlay--side { justify-content: flex-end; padding-left: max(40px, env(safe-area-inset-left, 0px)); }
}

/* ---------- כרטיסים ---------- */
.card {
  width: min(100%, 420px);
  background: var(--card);
  border: 1px solid var(--card-line);
  border-radius: 28px;
  padding: 28px 24px 24px;
  box-shadow: 0 18px 50px rgba(124, 108, 147, 0.16);
  backdrop-filter: blur(14px) saturate(1.1);
  -webkit-backdrop-filter: blur(14px) saturate(1.1);
  text-align: center;
  animation: card-in 0.7s cubic-bezier(.2, .8, .2, 1) both;
  max-height: calc(100svh - 48px);
  overflow-y: auto;
}
@keyframes card-in {
  from { opacity: 0; transform: translateY(14px) scale(.98); }
  to { opacity: 1; transform: none; }
}
.eyebrow {
  margin: 0 0 6px;
  font-size: 13px;
  letter-spacing: .06em;
  color: var(--sage-deep);
  font-weight: 600;
}
.title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(30px, 8vw, 40px);
  line-height: 1.1;
  color: var(--ink);
  text-wrap: balance;
}
.title em { font-style: normal; color: var(--blush-deep); }
.lead { margin: 10px auto 22px; max-width: 32ch; color: var(--ink-soft); line-height: 1.55; }

.btn-google {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 0 20px;
  border-radius: 999px;
  border: 1px solid rgba(79, 63, 75, 0.14);
  background: #fff;
  font-weight: 700;
  font-size: 17px;
  box-shadow: 0 4px 14px rgba(201, 127, 118, 0.18);
  transition: transform .15s ease, box-shadow .15s ease;
}
.btn-google:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(201, 127, 118, 0.26); }
.btn-google:disabled { opacity: .7; cursor: progress; transform: none; }
.btn-google svg { width: 22px; height: 22px; flex: none; }

.btn {
  min-height: 44px;
  padding: 0 18px;
  border-radius: 999px;
  border: 1px solid transparent;
  font-weight: 700;
  transition: background-color .15s ease, transform .15s ease;
}
.btn-primary { background: var(--blush-deep); color: #fff; }
.btn-primary:hover { background: #b96f66; }
.btn-soft { background: rgba(187, 174, 208, 0.25); color: var(--lilac-deep); }
.btn-soft:hover { background: rgba(187, 174, 208, 0.4); }
.btn-ghost { background: transparent; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 3px; }
.btn:disabled { opacity: .6; cursor: progress; }

.note { margin: 14px 0 0; font-size: 13px; color: var(--ink-soft); }
.error { margin: 12px 0 0; color: #a5514a; font-weight: 600; font-size: 14px; }
.demo-pill {
  display: inline-block;
  margin-bottom: 12px;
  padding: 4px 12px;
  border-radius: 999px;
  background: rgba(179, 198, 166, 0.35);
  color: var(--sage-deep);
  font-size: 12px;
  font-weight: 700;
}

.spinner {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2.5px solid rgba(124, 108, 147, 0.25);
  border-top-color: var(--lilac-deep);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-chip {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 10px 18px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--card-line);
  font-weight: 600; color: var(--ink-soft);
}

.skip {
  position: absolute;
  bottom: max(18px, calc(env(safe-area-inset-bottom, 0px) + 12px));
  left: max(16px, env(safe-area-inset-left, 0px));
  pointer-events: auto;
}

/* ---------- כרטיס ברוכים הבאים ---------- */
.clocks {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 18px 0 16px;
}
.clock {
  background: rgba(255, 255, 255, 0.6);
  border: 1px solid var(--card-line);
  border-radius: 18px;
  padding: 10px 8px;
}
.clock-label { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
.clock-time {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  direction: ltr;
}
.clock-day { font-size: 12px; color: var(--ink-soft); }
.clock--ca .clock-time { color: var(--blush-deep); }

.members { display: flex; flex-direction: column; gap: 10px; text-align: start; }
.member {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.55);
  border: 1px solid var(--card-line);
}
.member-face {
  width: 46px; height: 46px; flex: none; border-radius: 50%;
  background: var(--skin) center/cover no-repeat;
  border: 2px solid #fff;
  box-shadow: 0 0 0 2px var(--blush);
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 600; color: var(--blush-deep);
}
.member-body { flex: 1; min-width: 0; }
.member-name { font-weight: 700; }
.member-sub { font-size: 13px; color: var(--ink-soft); }
.member-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip {
  padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
  border: 1px solid var(--card-line); background: #fff; color: var(--ink-soft);
}
.chip[aria-pressed="true"] { background: var(--lilac); color: #fff; border-color: var(--lilac); }
.chip-upload { background: rgba(246, 202, 166, 0.45); color: var(--ink); border-color: transparent; }
.sr-file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

.invite { display: flex; gap: 8px; margin-top: 12px; }
.invite input {
  flex: 1; min-width: 0; min-height: 44px; padding: 0 14px;
  border-radius: 999px; border: 1px solid var(--card-line); background: #fff;
  direction: ltr; text-align: right;
}
.welcome-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }

/* ---------- הסצנה ---------- */
.sky { fill: url(#skyGrad); }
.sun { fill: var(--peach); }
.cloud { fill: #fffaf4; opacity: .92; }
.drift-a { animation: drift 46s ease-in-out infinite alternate; }
.drift-b { animation: drift 60s ease-in-out infinite alternate-reverse; }
.drift-c { animation: drift 38s ease-in-out infinite alternate; }
@keyframes drift { from { translate: -26px 0; } to { translate: 26px 0; } }
.hills-far { fill: #dccfe0; }
.bridge rect, .bridge path { fill: none; stroke: #c6a9b8; stroke-width: 2; }
.bridge rect { fill: #c6a9b8; stroke: none; }
.hills-near { fill: #c9d8bd; }
.tower rect, .tower path { fill: #e7dbe4; }
.tower .tower-glass { fill: var(--lilac); }
.tower-label { fill: var(--lilac-deep); font: 700 7px var(--font-display); text-anchor: middle; letter-spacing: .08em; }
.palm path { fill: var(--sage-deep); opacity: .75; }
.palm .palm-trunk { fill: none; stroke: #a98f86; stroke-width: 4; stroke-linecap: round; opacity: 1; }
.runway { fill: var(--runway); }
.runway-line { stroke: #fff; stroke-width: 2.5; stroke-dasharray: 18 16; opacity: .85; }
.grass { fill: var(--sage); }
.poppy line { stroke: var(--sage-deep); stroke-width: 1.4; }
.poppy circle { fill: #f2a77f; }

.fuselage { fill: var(--plane); stroke: rgba(124, 108, 147, .18); stroke-width: 1; }
.stripe { fill: var(--peach); }
.belly { fill: #f6ede6; }
.tail { fill: var(--lilac); }
.tail-heart { fill: var(--blush); }
.stabilizer { fill: var(--lilac-deep); opacity: .7; }
.window { fill: #8fa785; }
.wing { fill: var(--blush); }
.engine { fill: #efe3dc; stroke: rgba(124, 108, 147, .2); }
.gear { stroke: #9a8a93; stroke-width: 3; }
.wheel { fill: #5f5059; }
.door-gap { fill: #6b5867; }
.door { fill: var(--plane); stroke: rgba(124, 108, 147, .35); stroke-width: 1; transform-box: fill-box; transform-origin: 0% 50%; }
.stairs-side { fill: var(--lilac); }
.stair { stroke: var(--lilac-deep); stroke-width: 2.2; stroke-linecap: round; }
.stairs-rail { stroke: var(--lilac-deep); stroke-width: 1.6; stroke-linecap: round; }
.plane-shadow { fill: #8d7b88; opacity: .3; transform-box: fill-box; transform-origin: 50% 50%; }
.puff { fill: #fff; opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; }

/* דמויות */
.avatar .leg { stroke: var(--ink); stroke-width: 3.2; stroke-linecap: round; transform-box: view-box; }
.avatar .leg-l { transform-origin: -3.6px -12px; }
.avatar .leg-r { transform-origin: 3.6px -12px; }
.avatar .arm { stroke: var(--skin); stroke-width: 3; stroke-linecap: round; }
.avatar .arm-wave { transform-origin: 8.5px -21px; }
.avatar .neck-skin { fill: var(--skin); }
.avatar .head-ring { fill: none; stroke: #fff; stroke-width: 1.6; }
.avatar .eye { fill: var(--ink); }
.avatar .cheek { fill: var(--blush); opacity: .8; }
.avatar .smile { fill: none; stroke: var(--ink); stroke-width: 1.2; stroke-linecap: round; }
.avatar .beard { fill: var(--hair); display: none; }
.avatar.look-kippah .beard { display: inline; }
.avatar .acc-hat path, .avatar .acc-hat ellipse { fill: #f6e3c8; stroke: #e2c9a8; stroke-width: .8; }
.avatar .acc-hat .hat-band { fill: var(--blush); }
.avatar .acc-kippah { fill: var(--lilac-deep); }
.avatar.look-hat .acc-kippah, .avatar.look-kippah .acc-hat { display: none; }
.avatar:not(.has-photo) .avatar-photo { display: none; }
.avatar.has-photo .face { display: none; }

/* ---------- הכוריאוגרפיה של הנחיתה ---------- */
.scene .plane, .scene .stairs, .scene .walker { opacity: 0; }
.scene .walker { transform: translate(375px, 370px); }

.scene--landing .plane { animation: plane-land 3.6s cubic-bezier(.3, .55, .35, 1) both; }
.scene--landing .plane-shadow { animation: shadow-land 3.6s cubic-bezier(.3, .55, .35, 1) both; }
.scene--landing .puff-1 { animation: puff 1.1s 1.95s ease-out both; }
.scene--landing .puff-2 { animation: puff 1.2s 2.05s ease-out both; }
.scene--landing .puff-3 { animation: puff 1s 2.1s ease-out both; }
.scene--landing .door { animation: door-open .5s 3.8s ease-in-out both; }
.scene--landing .stairs { animation: stairs-in .6s 4.15s cubic-bezier(.2, .8, .2, 1) both; }
.scene--landing .walker-0 { animation: walk-0 3.4s 4.8s linear both; }
.scene--landing .walker-1 { animation: walk-1 3.4s 5.5s linear both; }
.scene--landing .walker-0 .bob { animation: bob .34s 4.8s ease-in-out 10 alternate; }
.scene--landing .walker-1 .bob { animation: bob .34s 5.5s ease-in-out 10 alternate; }
.scene--landing .walker-0 .leg-l { animation: step .34s 4.8s ease-in-out 10 alternate; }
.scene--landing .walker-0 .leg-r { animation: step .34s 4.8s ease-in-out 10 alternate-reverse; }
.scene--landing .walker-1 .leg-l { animation: step .34s 5.5s ease-in-out 10 alternate; }
.scene--landing .walker-1 .leg-r { animation: step .34s 5.5s ease-in-out 10 alternate-reverse; }
.scene--landing .walker-0 .arm-wave { animation: wave .45s 8.3s ease-in-out 6 alternate; }
.scene--landing .walker-1 .arm-wave { animation: wave .45s 9s ease-in-out 6 alternate; }

/* מצב "הגענו": כל החלקים במקומם הסופי, בלי לחכות */
.scene--arrived .plane, .scene--arrived .stairs { opacity: 1; }
.scene--arrived .door { transform: scaleX(0); }
.scene--arrived .walker { opacity: 1; }
.scene--arrived .walker-0 { transform: translate(340px, 470px) scale(2.3); }
.scene--arrived .walker-1 { transform: translate(430px, 474px) scale(2.3); }
.scene--arrived .walker .arm-wave { animation: wave .5s ease-in-out 4 alternate; }

@keyframes plane-land {
  0%   { opacity: 1; transform: translate(-700px, -420px) rotate(5deg); }
  55%  { transform: translate(-190px, -3px) rotate(-4deg); }
  60%  { transform: translate(-160px, 0) rotate(-2.5deg); }
  72%  { transform: translate(-70px, 0) rotate(0deg); }
  100% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
}
@keyframes shadow-land {
  0%   { opacity: 0; transform: translateX(-560px) scaleX(.3); }
  50%  { opacity: .2; transform: translateX(-210px) scaleX(.8); }
  60%  { opacity: .32; transform: translateX(-160px) scaleX(1); }
  100% { opacity: .32; transform: translateX(0) scaleX(1); }
}
@keyframes puff {
  0%   { opacity: .9; transform: translate(0, 0) scale(.2); }
  100% { opacity: 0; transform: translate(-26px, -10px) scale(2.2); }
}
@keyframes door-open { to { transform: scaleX(0); } }
@keyframes stairs-in {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: none; }
}
@keyframes walk-0 {
  0%   { opacity: 0; transform: translate(375px, 371px) scale(1); }
  8%   { opacity: 1; transform: translate(375px, 371px) scale(1); }
  18%  { transform: translate(363px, 371px) scale(1); }
  52%  { transform: translate(303px, 404px) scale(1.1); }
  100% { opacity: 1; transform: translate(340px, 470px) scale(2.3); }
}
@keyframes walk-1 {
  0%   { opacity: 0; transform: translate(375px, 371px) scale(1); }
  8%   { opacity: 1; transform: translate(375px, 371px) scale(1); }
  18%  { transform: translate(363px, 371px) scale(1); }
  52%  { transform: translate(303px, 404px) scale(1.1); }
  100% { opacity: 1; transform: translate(430px, 474px) scale(2.3); }
}
@keyframes bob { from { translate: 0 0; } to { translate: 0 -1.6px; } }
@keyframes step { from { rotate: -16deg; } to { rotate: 16deg; } }
@keyframes wave { from { rotate: 0deg; } to { rotate: -70deg; } }

@media (prefers-reduced-motion: reduce) {
  .drift-a, .drift-b, .drift-c { animation: none; }
  .card { animation: none; }
}

/* עמוד הבית — "קליפורניה." בקו נקי ומואר.
   פריסה: סיפור גלילה אנכי. שמיים בהירים ← דגלים על לבן ← מסלול טיסה ננעץ ← כרטיסי זכוכית על אורות צבעוניים ← סיום. */
.home {
  --h-bg: #fbfbfd;
  --h-ink: #1d1d1f;
  --h-soft: #6e6e73;
  --h-line: rgba(29, 29, 31, 0.08);
  --sky-1: #86c8f0;
  --sky-2: #c4e5f9;
  --paper-yellow: #f7c948;
  --paper-mint: #9eddb2;
  --flag-yellow: #ffd21f;
  --flag-purple: #4b2a7b;
  --glass: rgba(255, 255, 255, 0.58);
  --glass-line: rgba(255, 255, 255, 0.75);
  --glass-shadow: 0 1px 0 rgba(255, 255, 255, 0.9) inset, 0 20px 60px rgba(30, 60, 100, 0.12);
  --font-home: "Noto Sans Hebrew", "Heebo", "Assistant", system-ui, sans-serif;

  background: var(--h-bg);
  color: var(--h-ink);
  font-family: var(--font-home);
  overflow-x: clip;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body:has(.home) { background: #fbfbfd; overflow: auto; }

.home .glass {
  background: var(--glass);
  border: 1px solid var(--glass-line);
  box-shadow: var(--glass-shadow);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
}

/* ---------- טיפוגרפיה ---------- */
.eyebrow-home {
  margin: 0 0 14px;
  font-size: clamp(15px, 1.6vw, 19px);
  font-weight: 600;
  color: var(--h-soft);
  letter-spacing: 0.01em;
}
.hero-title {
  margin: 0;
  font-size: clamp(76px, 17vw, 210px);
  font-weight: 800;
  line-height: 0.95;
  letter-spacing: -0.035em;
  color: var(--h-ink);
}
.hero-title .dot { color: var(--paper-yellow); }
.section-title {
  margin: 0;
  font-size: clamp(44px, 8vw, 104px);
  font-weight: 800;
  line-height: 1.02;
  letter-spacing: -0.03em;
  text-wrap: balance;
}
.lede {
  margin: 20px auto 0;
  max-width: 34ch;
  font-size: clamp(19px, 2.2vw, 26px);
  font-weight: 500;
  line-height: 1.45;
  color: var(--h-soft);
  text-wrap: pretty;
}
.section { padding-block: clamp(96px, 14vw, 180px); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); position: relative; }
.section-head { text-align: center; max-width: 900px; margin-inline: auto; position: relative; z-index: 2; }

/* ---------- סרגל עליון ---------- */
.nav {
  position: fixed;
  inset: 0 0 auto;
  z-index: 50;
  padding-top: env(safe-area-inset-top, 0px);
  background: rgba(251, 251, 253, 0.68);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--h-line);
}
.nav-inner {
  height: 52px;
  max-width: 1080px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.nav-brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; color: var(--h-ink); text-decoration: none; }
.nav .nav-plane { width: 30px; height: auto; transform: scaleX(-1); filter: none; }
.nav-side { display: flex; align-items: center; gap: 12px; }
.nav-demo { font-size: 12px; font-weight: 600; color: var(--h-soft); padding: 3px 10px; border-radius: 999px; background: rgba(29, 29, 31, 0.05); }
.nav-faces { display: flex; }
.nav-face {
  width: 28px; height: 28px; border-radius: 50%;
  margin-inline-start: -8px;
  border: 2px solid var(--h-bg);
  background: #f3e2d6 center/cover no-repeat;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 700; color: #b06a5f;
}
.nav-face:first-child { margin-inline-start: 0; }
.nav-link { background: none; border: 0; padding: 6px 2px; font-size: 14px; color: var(--h-ink); opacity: 0.8; }
.nav-link:hover { opacity: 1; }

/* ---------- פתיחה ---------- */
.hero {
  position: relative;
  min-height: 100svh;
  display: grid;
  place-items: center;
  overflow: hidden;
  padding: 120px max(20px, env(safe-area-inset-right, 0px)) 120px max(20px, env(safe-area-inset-left, 0px));
  background:
    radial-gradient(60% 50% at 70% 18%, rgba(255, 255, 255, 0.65), transparent 70%),
    linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 46%, #eef7fd 78%, var(--h-bg) 100%);
}
.hero-copy { position: relative; z-index: 3; text-align: center; will-change: transform, opacity; }
.hero-pill {
  display: inline-flex; align-items: center; gap: 10px;
  margin-top: 30px; padding: 12px 22px; border-radius: 999px;
  font-size: 15px; font-weight: 600; color: var(--h-ink);
}
.pill-dot { width: 8px; height: 8px; border-radius: 50%; background: #34c759; box-shadow: 0 0 0 4px rgba(52, 199, 89, 0.18); }

.hero-plane { position: absolute; z-index: 2; will-change: transform; }
.hero-plane--yellow { width: clamp(180px, 30vw, 420px); top: 15%; right: 4%; }
.hero-plane--mint { width: clamp(130px, 19vw, 270px); bottom: 17%; left: 6%; }
.hero-plane--yellow .origami-svg { transform: scaleX(-1) rotate(-14deg); }
.hero-plane--mint .origami-svg { transform: rotate(-10deg); }
.origami-svg { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 22px 26px rgba(30, 70, 120, 0.22)); }

.origami--yellow { --f1: #ffe48a; --f2: #f7c948; --f3: #e3ad2b; --f4: #c98f17; }
.origami--mint { --f1: #d5f5de; --f2: #a6e3b9; --f3: #7fcb98; --f4: #5fb07c; }
.origami--white { --f1: #ffffff; --f2: #eef2f6; --f3: #d9e1ea; --f4: #c2cdd9; }
.origami .f1 { fill: var(--f1); }
.origami .f2 { fill: var(--f2); }
.origami .f3 { fill: var(--f3); }
.origami .f4 { fill: var(--f4); }
.origami .crease { stroke: rgba(255, 255, 255, 0.7); stroke-width: 1.2; }

.cloud {
  position: absolute;
  z-index: 1;
  aspect-ratio: 2.3;
  pointer-events: none;
  background:
    radial-gradient(ellipse 24% 52% at 28% 62%, #fff 55%, #eaf3fa 92%, transparent 100%),
    radial-gradient(ellipse 26% 60% at 52% 42%, #fff 55%, #ecf4fb 92%, transparent 100%),
    radial-gradient(ellipse 20% 46% at 75% 60%, #fff 55%, #eaf3fa 92%, transparent 100%),
    radial-gradient(ellipse 46% 30% at 50% 74%, #fff 60%, #e8f1f9 94%, transparent 100%);
  filter: drop-shadow(0 18px 22px rgba(50, 100, 150, 0.16));
  opacity: 0.95;
}

.scroll-cue {
  position: absolute; bottom: max(28px, env(safe-area-inset-bottom, 0px)); left: 50%;
  width: 26px; height: 42px; margin-left: -13px;
  border: 2px solid rgba(29, 29, 31, 0.28); border-radius: 14px; z-index: 3;
}
.scroll-cue span {
  position: absolute; top: 8px; left: 50%; width: 4px; height: 8px; margin-left: -2px;
  border-radius: 2px; background: rgba(29, 29, 31, 0.45);
  animation: cue 1.8s ease-in-out infinite;
}
@keyframes cue { 0% { transform: translateY(0); opacity: 1; } 70% { transform: translateY(12px); opacity: 0; } 100% { opacity: 0; } }

/* ---------- דגלים ---------- */
.flags { background: var(--h-bg); }
.flag-stage {
  margin: clamp(56px, 8vw, 96px) auto 0;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: clamp(8px, 4vw, 64px);
  --fh: clamp(66px, 14vw, 150px);
}
/* כל תורן תופס רוחב של הדגל שלו, כדי שהדגלים לא יעלו זה על זה */
.pole-rig { direction: ltr; position: relative; display: flex; flex-direction: column; align-items: flex-start; width: calc(var(--fh) * var(--ratio) + 14px); }
.pole {
  position: relative;
  width: 7px;
  height: calc(var(--fh) * 3.1);
  border-radius: 4px;
  background: linear-gradient(90deg, #b9bec6, #f4f6f8 45%, #9aa1ab);
  box-shadow: 0 30px 40px -20px rgba(0, 0, 0, 0.25);
}
.pole-cap {
  position: absolute; top: -11px; left: 50%; width: 15px; height: 15px; margin-left: -7.5px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff5c9, #e8b931 55%, #a87a12);
}
.flag-mount { position: absolute; top: 10px; left: 6px; height: var(--fh); will-change: transform; }
.flag { position: relative; height: 100%; filter: drop-shadow(0 16px 20px rgba(20, 30, 60, 0.18)); }
.flag-strip { position: absolute; top: 0; bottom: 0; will-change: transform; }
.flag-strip svg { display: block; width: 100%; height: 100%; }
.flag-shade { position: absolute; inset: 0; pointer-events: none; }
.flag-caption { direction: rtl; margin: 18px 0 0; font-size: 15px; font-weight: 600; color: var(--h-soft); }

/* ---------- המסע ---------- */
.journey {
  min-height: 100svh;
  display: grid;
  place-items: center;
  background: linear-gradient(180deg, var(--h-bg), #f1f7fc 50%, var(--h-bg));
  padding-block: 90px 40px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.journey-inner { width: min(100%, 1100px); }
.journey-map { position: relative; margin-top: clamp(16px, 4vw, 40px); }
.journey-svg { display: block; width: 100%; height: auto; transform: scaleX(-1); overflow: visible; }
.journey-ghost { fill: none; stroke: rgba(29, 29, 31, 0.12); stroke-width: 2; stroke-dasharray: 2 12; stroke-linecap: round; }
.journey-path { fill: none; stroke: var(--paper-yellow); stroke-width: 3.5; stroke-linecap: round; }
.journey-dot { fill: var(--h-ink); }
.journey-end { fill: var(--paper-yellow); transform-box: fill-box; transform-origin: center; }
.journey-plane { filter: drop-shadow(0 10px 12px rgba(30, 70, 120, 0.25)); }
.journey-label {
  position: absolute; bottom: -6px;
  display: flex; flex-direction: column; align-items: center;
  font-size: clamp(15px, 2vw, 22px); font-weight: 700;
}
.journey-label small { font-size: 0.7em; font-weight: 600; color: var(--h-soft); letter-spacing: 0.12em; }
.journey-label--from { right: 0; transform: translateX(30%); }
.journey-label--to { left: 0; transform: translateX(-30%); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(10px, 2vw, 20px); margin-top: clamp(40px, 6vw, 70px); }
.stat { border-radius: 24px; padding: clamp(16px, 2.6vw, 28px) 12px; text-align: center; display: flex; flex-direction: column; gap: 6px; }
.stat-num { font-size: clamp(30px, 5vw, 60px); font-weight: 800; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.stat-label { font-size: clamp(13px, 1.4vw, 16px); color: var(--h-soft); font-weight: 500; }

/* ---------- כרטיסי זכוכית ---------- */
.features { overflow: hidden; background: var(--h-bg); }
.blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.75; z-index: 0; will-change: transform; }
.blob--yellow { width: 42vw; height: 42vw; background: #ffe58f; top: 18%; right: -8%; }
.blob--mint { width: 36vw; height: 36vw; background: #b6ecc8; bottom: 6%; left: -6%; }
.blob--sky { width: 30vw; height: 30vw; background: #b9e0fa; top: 44%; left: 30%; }
.blob--lilac { width: 26vw; height: 26vw; background: #ddd0f0; top: 8%; left: 6%; }
.feature-grid {
  position: relative; z-index: 2;
  max-width: 1080px;
  margin: clamp(48px, 7vw, 80px) auto 0;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  gap: 18px;
  perspective: 1200px;
}
.feature { border-radius: 28px; padding: 26px 26px 28px; min-width: 0; transform-origin: 50% 100%; }
.feature-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 26px; }
.feature-badge {
  width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center;
  background: rgba(255, 255, 255, 0.85); color: var(--h-ink);
  box-shadow: 0 6px 16px rgba(30, 60, 100, 0.1);
}
.feature-icon { width: 24px; height: 24px; }
.feature-status { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; color: #8a6a10; background: rgba(247, 201, 72, 0.3); }
.feature h3 { margin: 0 0 8px; font-size: 24px; font-weight: 700; letter-spacing: -0.015em; }
.feature p { margin: 0; font-size: 16px; line-height: 1.55; color: #48484d; }

/* ---------- סיום ---------- */
.finale { text-align: center; overflow: hidden; background: linear-gradient(180deg, var(--h-bg), #eef7fd); }
.finale-plane { position: absolute; width: clamp(110px, 14vw, 190px); z-index: 1; pointer-events: none; }
.finale-plane--a { top: 12%; right: 10%; }
.finale-plane--a .origami-svg { transform: scaleX(-1); }
.finale-plane--b { bottom: 22%; left: 8%; }
.finale-clocks { max-width: 440px; margin: 40px auto 0; position: relative; z-index: 2; }
.finale-clocks .clocks { margin: 0; }
.finale-clocks .clock { background: var(--glass); border-color: var(--glass-line); border-radius: 22px; padding: 16px 10px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
.finale-clocks .clock-time { font-family: var(--font-home); font-weight: 800; font-size: 34px; letter-spacing: -0.02em; color: var(--h-ink); }
.finale-clocks .clock--ca .clock-time { color: #d39b12; }
.finale-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 34px; position: relative; z-index: 2; }
.pill-btn {
  min-height: 48px; padding: 0 24px; border-radius: 999px; font-weight: 600; font-size: 16px;
  border: 1px solid var(--h-line); background: #fff; color: var(--h-ink);
  transition: transform 0.2s ease, background-color 0.2s ease;
}
.pill-btn:hover { transform: translateY(-1px); }
.pill-btn--dark { background: var(--h-ink); color: #fff; border-color: var(--h-ink); }
.footer-note { margin: 70px 0 0; font-size: 13px; color: var(--h-soft); }

@media (max-width: 640px) {
  .hero-plane--yellow { top: 11%; right: -4%; }
  .hero-plane--mint { bottom: 13%; left: -2%; }
  .stats { grid-template-columns: 1fr; }
  .stat { flex-direction: row; justify-content: space-between; align-items: center; padding: 16px 20px; text-align: start; }
  .nav-demo { display: none; }
}
